<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DipoTrack - Driver Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; color: #3b82f6; }
        .header p { color: #94a3b8; font-size: 14px; margin-top: 4px; }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .card h2 { font-size: 16px; color: #94a3b8; margin-bottom: 16px; }

        select, button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        select {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            margin-bottom: 16px;
        }

        .btn-start {
            background: #22c55e;
            color: white;
            font-weight: 700;
            font-size: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-start:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-stop {
            background: #ef4444;
            color: white;
            font-weight: 700;
            font-size: 18px;
            padding: 16px;
            margin-top: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-box {
            background: #0f172a;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #334155;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }
        .status-row:last-child { border-bottom: none; }
        .status-label { color: #94a3b8; }
        .status-value { color: white; font-weight: 600; }
        .status-value.green { color: #22c55e; }
        .status-value.yellow { color: #eab308; }
        .status-value.red { color: #ef4444; }

        .pulse-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .info-note {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fa-solid fa-bus-simple"></i> DipoTrack</h1>
    <p>Panel Sopir — Kirim Lokasi GPS Real-time</p>
</div>

<div class="card">
    <h2><i class="fa-solid fa-id-card"></i> Pilih Bus Kamu</h2>
    <select id="bus-select">
        <option value="dipo-01">🚌 Bus Dipo 01 — H 1092 AD (Koridor 1)</option>
    </select>

    <button class="btn-start" id="btn-start" onclick="startTracking()">
        <i class="fa-solid fa-satellite-dish"></i> Mulai Kirim Lokasi
    </button>
    <button class="btn-stop" id="btn-stop" onclick="stopTracking()">
        <i class="fa-solid fa-stop"></i> Hentikan Tracking
    </button>

    <div class="status-box">
        <div class="status-row">
            <span class="status-label">Status</span>
            <span class="status-value" id="st-status">Belum aktif</span>
        </div>
        <div class="status-row">
            <span class="status-label">Bus Dipilih</span>
            <span class="status-value" id="st-bus">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">Latitude</span>
            <span class="status-value" id="st-lat">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">Longitude</span>
            <span class="status-value" id="st-lng">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">Akurasi GPS</span>
            <span class="status-value" id="st-acc">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">Terakhir Update</span>
            <span class="status-value" id="st-time">-</span>
        </div>
    </div>

    <p class="info-note">
        ⚠️ Izinkan akses lokasi saat diminta browser.<br>
        Lokasi akan dikirim ke Firebase setiap 3 detik.
    </p>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCTWNRJapk7OCnqHmRragwYnSzLbm7XjUI",
        authDomain: "dipotrack-d060e.firebaseapp.com",
        databaseURL: "https://dipotrack-d060e-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dipotrack-d060e",
        storageBucket: "dipotrack-d060e.firebasestorage.app",
        messagingSenderId: "353541198500",
        appId: "1:353541198500:web:b6f23404dac2d0ce91cc31"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let watchId = null;
    let intervalId = null;
    let lastLat = null;
    let lastLng = null;

    window.startTracking = function() {
        const busId = document.getElementById("bus-select").value;
        const busNames = {
            "dipo-01": "Bus Dipo 01",
            "dipo-02": "Bus Dipo 02",
            "dipo-03": "Bus Dipo 03"
        };

        document.getElementById("st-bus").textContent = busNames[busId];
        document.getElementById("st-status").textContent = "Mencari sinyal GPS...";
        document.getElementById("st-status").className = "status-value yellow";
        document.getElementById("btn-start").style.display = "none";
        document.getElementById("btn-stop").style.display = "flex";
        document.getElementById("bus-select").disabled = true;

        if (!navigator.geolocation) {
            document.getElementById("st-status").textContent = "GPS tidak didukung!";
            document.getElementById("st-status").className = "status-value red";
            return;
        }

        // Ambil posisi GPS terus-menerus
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                lastLat = position.coords.latitude;
                lastLng = position.coords.longitude;
                const acc = Math.round(position.coords.accuracy);

                document.getElementById("st-lat").textContent = lastLat.toFixed(6);
                document.getElementById("st-lng").textContent = lastLng.toFixed(6);
                document.getElementById("st-acc").textContent = `±${acc} meter`;
                document.getElementById("st-status").innerHTML = `<span class="pulse-dot"></span>Live`;
                document.getElementById("st-status").className = "status-value green";
                document.getElementById("st-time").textContent = new Date().toLocaleTimeString('id-ID');
            },
            (err) => {
                document.getElementById("st-status").textContent = "GPS Error: " + err.message;
                document.getElementById("st-status").className = "status-value red";
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );

        // Kirim ke Firebase setiap 3 detik
        intervalId = setInterval(() => {
            if (lastLat && lastLng) {
                set(ref(db, `buses/${busId}`), {
                    lat: lastLat,
                    lng: lastLng,
                    timestamp: Date.now(),
                    busId: busId
                });
            }
        }, 3000);
    };

    window.stopTracking = function() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (intervalId) clearInterval(intervalId);
        watchId = null;
        intervalId = null;

        document.getElementById("st-status").textContent = "Dihentikan";
        document.getElementById("st-status").className = "status-value red";
        document.getElementById("btn-start").style.display = "flex";
        document.getElementById("btn-stop").style.display = "none";
        document.getElementById("bus-select").disabled = false;
    };
</script>

</body>
</html>
