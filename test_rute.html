<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: white; font-family: sans-serif; }
  #map { width: 100vw; height: 100vh; }
  #info { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.8); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 999; max-width: 220px; }

</head>

</html>
